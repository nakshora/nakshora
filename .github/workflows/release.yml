name: Release & Publish

# Automatic publishing pipeline (Changesets-based).
#
# How the release flow works (changesets "release PR" mode):
#
#   1. Dev PRs carry changesets (`.changeset/*.md`, added via `pnpm changeset:add`).
#      The "Changesets status" check validates them.
#   2. Merging a changeset PR into `main` → the release job runs the
#      changesets action, which bumps versions + changelogs and opens a
#      "Version Packages" release PR (`changeset-release/main`).
#   3. Merging that release PR into `main` → the action publishes all
#      unpublished packages to npm (with provenance), pushes the version
#      tags and creates a GitHub Release per package with its changelog.
#   4. A mirror is published to GitHub Packages (npm registry).
#
# Secrets required (repo Settings → Secrets):
#   NPM_TOKEN  — npm Granular Access Token with *Read and write* access to the
#                @nakshora org (https://www.npmjs.com/settings/<user>/tokens/granular-access-tokens/new).
#                Without it the release PR is still opened, but publishing fails.
#                (Alternative: npm trusted publishing — the changesets action
#                falls back to the workflow's OIDC identity when NPM_TOKEN is absent.)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # `packages: write` is required by the GitHub Packages mirror step — when a
  # workflow declares `permissions:` explicitly, every scope it omits is `none`.
  packages: write
  # OIDC token for npm provenance (and for npm trusted publishing, which the
  # changesets action falls back to when NPM_TOKEN is absent).
  id-token: write

jobs:
  # ── PR check: validate + report changesets ───────────────────────────────
  changesets-check:
    name: Changesets status
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 📝 Check changesets status
        run: |
          # ensure the base ref is present (PR checkouts have no local `main`)
          git fetch -q origin main || true
          if ls .changeset/*.md >/dev/null 2>&1; then
            echo "## 📝 This PR contains changesets" >> "$GITHUB_STEP_SUMMARY"
            pnpm exec changeset status --since=origin/main
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ Merging this PR into \`main\` will open/update the **Version Packages** release PR. Merging that release PR publishes to npm + GitHub Packages automatically." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ⚠️ This PR has no changesets" >> "$GITHUB_STEP_SUMMARY"
            pnpm exec changeset status --since=origin/main || true
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Nothing to release from this PR. Add a changeset with \`pnpm changeset:add\` if it should be part of the next release." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── Quality gate ─────────────────────────────────────────────────────────
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    needs: changesets-check
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: 📦 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build (types resolve from dist/)
        run: pnpm build

      - name: 🔍 Type check
        run: pnpm type-check

      - name: 🧪 Run tests
        run: pnpm test

      - name: 🔎 Lint
        run: pnpm lint

      - name: 🎨 Format check
        run: pnpm format:check

  # ── Release: version (release PR) → publish → GitHub Packages ────────────
  release:
    name: Create Release & Publish
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build packages
        run: pnpm build

      - name: 🔐 Preflight — npm credentials
        id: preflight
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "npm_token=present" >> "$GITHUB_OUTPUT"
            echo "✅ NPM_TOKEN is set (${#NPM_TOKEN} characters)."
            echo "✅ \`NPM_TOKEN\` is set — publishing to npmjs.com can proceed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "npm_token=missing" >> "$GITHUB_OUTPUT"
            echo "::warning title=NPM_TOKEN missing::NPM_TOKEN is not set in Settings → Secrets and variables → Actions. The Version Packages release PR can still be opened, but publishing to npm will fail until the token exists."
            {
              echo "⚠️ \`NPM_TOKEN\` is **not** set."
              echo ""
              echo "Add it in *Settings → Secrets and variables → Actions → New repository secret*: an npm **Granular Access Token** with *Read and write* permission for the \`@nakshora\` org/packages. Versioning (the release PR) does not need it — publishing does."
            } >> "$GITHUB_STEP_SUMMARY"
            # Publish phase (release PR merged ⇒ no pending changesets) cannot
            # succeed without credentials — fail fast with an actionable error
            # instead of a confusing registry 401/ENEEDAUTH later on.
            if ! ls .changeset/*.md >/dev/null 2>&1; then
              echo "::error title=Cannot publish — NPM_TOKEN missing::No pending changesets (publish phase) but NPM_TOKEN is not set. Add the secret, then re-run this job."
              exit 1
            fi
          fi

      - name: 📝 Version (opens release PR) or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          # When changesets are pending: bumps versions + changelogs and
          # opens the "Version Packages" release PR.
          # When the release PR is merged (no pending changesets, but
          # unpublished versions exist): runs the publish script.
          #
          # NOTE: this must be `pnpm changeset version`, NOT `pnpm version`.
          # pnpm intercepts the bare `version` command and prints its own
          # version manifest instead of running the root `version` script, so
          # nothing was ever bumped and the release PR was never opened.
          version: pnpm changeset version
          publish: pnpm publish:packages
          commit: 'chore(release): bump versions'
          title: 'chore(release): bump versions'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: 📤 Publish to GitHub Packages (mirror)
        if: steps.changesets.outputs.published == 'true'
        run: node scripts/publish-github.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Pack release tarballs
        if: steps.changesets.outputs.published == 'true'
        run: |
          mkdir -p releases
          for package in packages/@nakshora/*; do
            [ -f "$package/package.json" ] || continue
            [ -d "$package/dist" ] || continue
            # `pnpm pack` (not `npm pack`) so `workspace:*` dependencies are
            # rewritten to real versions in the packed manifest.
            (cd "$package" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/releases")
          done
          ls -lh releases/
        continue-on-error: true

      - name: 📎 Attach tarballs to the GitHub Releases
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for tarball in releases/*.tgz; do
            [ -e "$tarball" ] || continue
            tag=$(tar -xzOf "$tarball" package/package.json |
              node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log(j.name+'@'+j.version)})")
            gh release upload "$tag" "$tarball" --clobber ||
              echo "::warning::could not attach $tarball to release $tag"
          done
        continue-on-error: true

      - name: 🗃️ Upload tarballs as workflow artifacts
        if: steps.changesets.outputs.published == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs
          path: releases/*.tgz
          retention-days: 90
          if-no-files-found: warn
