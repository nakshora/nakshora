name: Release & Publish

# Automatic publishing pipeline (Changesets-based).
#
# How the release flow works (changesets "release PR" mode):
#
#   1. Dev PRs carry changesets (`.changeset/*.md`, added via `pnpm changeset:add`).
#      The "Changesets status" check validates them.
#   2. Merging a changeset PR into `main` → the release job runs the
#      changesets action, which bumps versions + changelogs and opens a
#      "Version Packages" release PR (`changeset-release/main`).
#   3. Merging that release PR into `main` → the action publishes all
#      unpublished packages to npm (with provenance), pushes the version
#      tags and creates a GitHub Release per package with its changelog.
#   4. A mirror is published to GitHub Packages (npm registry).
#
# Secrets required (repo Settings → Secrets):
#   NPM_TOKEN  — read/write token from https://www.npmjs.com/settings/<user>/tokens

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  # ── PR check: validate + report changesets ───────────────────────────────
  changesets-check:
    name: Changesets status
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 📝 Check changesets status
        run: |
          if ls .changeset/*.md >/dev/null 2>&1; then
            echo "## 📝 This PR contains changesets" >> "$GITHUB_STEP_SUMMARY"
            pnpm exec changeset status
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ Merging this PR into \`main\` will open/update the **Version Packages** release PR. Merging that release PR publishes to npm + GitHub Packages automatically." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ⚠️ This PR has no changesets" >> "$GITHUB_STEP_SUMMARY"
            pnpm exec changeset status || true
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Nothing to release from this PR. Add a changeset with \`pnpm changeset:add\` if it should be part of the next release." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── Quality gate ─────────────────────────────────────────────────────────
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    needs: changesets-check
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: 📦 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build (types resolve from dist/)
        run: pnpm build

      - name: 🔍 Type check
        run: pnpm type-check

      - name: 🧪 Run tests
        run: pnpm test

      - name: 🔎 Lint
        run: pnpm lint

      - name: 🎨 Format check
        run: pnpm format:check

  # ── Release: version (release PR) → publish → GitHub Packages ────────────
  release:
    name: Create Release & Publish
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build packages
        run: pnpm build

      - name: 📝 Version (opens release PR) or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          # When changesets are pending: bumps versions + changelogs and
          # opens the "Version Packages" release PR.
          # When the release PR is merged (no pending changesets, but
          # unpublished versions exist): runs the publish script.
          version: pnpm version
          publish: pnpm publish:packages
          commit: 'chore(release): bump versions'
          title: 'chore(release): bump versions'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: 📤 Publish to GitHub Packages (mirror)
        if: steps.changesets.outputs.published == 'true'
        run: node scripts/publish-github.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Pack tarballs (attached to npm dist-tags on demand)
        if: steps.changesets.outputs.published == 'true'
        run: |
          mkdir -p releases
          for package in packages/@nakshora/*; do
            if [ -f "$package/package.json" ] && [ -d "$package/dist" ]; then
              (cd "$package" && npm pack --pack-destination "$GITHUB_WORKSPACE/releases")
            fi
          done
          ls -lh releases/
        continue-on-error: true
