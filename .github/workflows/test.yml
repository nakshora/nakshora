name: Test & Quality

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18.x, 20.x, 22.x]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: 📦 Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Type check
        run: pnpm type-check

      - name: 🧪 Run tests
        run: pnpm test

      - name: 📊 Test coverage
        run: pnpm test:coverage

      - name: 📤 Upload coverage
        if: matrix.node == '22.x'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🎨 Check formatting
        run: pnpm format:check

      - name: 🔎 Lint code
        run: pnpm lint

  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build all packages
        run: pnpm build

      - name: 🔌 Verify CLI runs
        run: |
          node packages/@nakshora/cli/dist/cli.js --version
          node packages/@nakshora/cli/dist/cli.js --help | head -20

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/@nakshora/*/dist
          retention-days: 7

  size-check:
    name: Bundle Size & Benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build packages
        run: pnpm build

      - name: ⚡ Run benchmarks
        run: |
          pnpm benchmark | tee $GITHUB_STEP_SUMMARY

      - name: 📊 Check bundle sizes
        run: |
          {
            echo "## Bundle Sizes"
            echo ""
            for package in packages/@nakshora/*; do
              if [ -d "$package/dist" ]; then
                echo "### $(basename $package)"
                find "$package/dist" -maxdepth 1 -name "*.js" -o -name "*.cjs" -o -name "*.d.ts" -o -name "*.css" | sort | while read file; do
                  size=$(du -h "$file" | cut -f1)
                  gzip_size=$(gzip -c "$file" | du -h | cut -f1)
                  echo "- $(basename $file): $size (gzip: $gzip_size)"
                done
                echo ""
              fi
            done
          } >> $GITHUB_STEP_SUMMARY
