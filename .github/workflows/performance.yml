name: Performance Tracking

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build packages
        run: pnpm build

      - name: ⚡ Run benchmarks
        run: pnpm benchmark

      - name: 📊 Measure bundle sizes
        run: |
          {
            echo "# Performance Report — $(date)"
            echo ""
            echo "## Bundle Sizes (raw → gzip)"
            echo ""
            for package in packages/@nakshora/*; do
              if [ -d "$package/dist" ]; then
                echo "### $(basename $package)"
                find "$package/dist" -maxdepth 1 -type f \( -name "*.js" -o -name "*.cjs" -o -name "*.css" -o -name "*.d.ts" \) | sort | while read file; do
                  size=$(du -h "$file" | cut -f1)
                  gzip_size=$(gzip -c "$file" | du -h | cut -f1)
                  echo "- $(basename $file): $size (gzip: $gzip_size)"
                done
                echo ""
              fi
            done
          } > performance.md
          cat performance.md >> $GITHUB_STEP_SUMMARY

      - name: 📤 Store performance report
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: performance.md
          retention-days: 90
