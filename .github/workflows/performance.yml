name: Performance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  benchmark:
    name: Benchmark + regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build packages
        run: pnpm build:core

      # The reference is measured on THIS runner so machine speed cancels out:
      # for pull requests the merge-base with the target branch, for pushes to
      # main the previous commit. Falls back to the committed perf/baseline.json.
      - name: 📐 Measure reference commit
        id: ref
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REF=$(git merge-base origin/${{ github.base_ref }} HEAD)
          else
            REF=$(git rev-parse HEAD~1 2>/dev/null || echo "")
          fi
          if [ -z "$REF" ]; then
            echo "no reference commit; using perf/baseline.json"
            cp perf/baseline.json /tmp/reference.json
            exit 0
          fi
          echo "reference = $REF"
          git worktree add /tmp/ref "$REF"
          (cd /tmp/ref && pnpm install --frozen-lockfile && pnpm build:core \
            && node scripts/benchmark.mjs --update --baseline /tmp/reference.json) \
            || { echo "reference build failed; using perf/baseline.json"; cp perf/baseline.json /tmp/reference.json; }

      - name: ⚡ Benchmark HEAD and check (>10 % slower / larger fails)
        run: |
          node scripts/benchmark.mjs --json perf/report.json --baseline /tmp/reference.json --check | tee perf/report.md

      - name: 📊 Summary
        if: always()
        run: |
          {
            echo "## Performance — $(git rev-parse --short HEAD)"
            echo ""
            echo '```'
            cat perf/report.md
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Store performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report-${{ github.sha }}
          path: |
            perf/report.json
            perf/report.md
            /tmp/reference.json
          retention-days: 90
